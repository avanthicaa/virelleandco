<!DOCTYPE html>
<html>
<head>

<title>Collection</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@300;400;500;600&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<!-- NAVBAR -->

<nav>

    <div class="logo-container">

        <img src="{{ url_for('static',
        filename='images/logo.jpeg') }}"
        class="nav-logo">

        <div class="logo-text">
            Virelle & Co.
        </div>

    </div>

    <ul>

        <li><a href="/">Home</a></li>
        <li><a href="/products">Collection</a></li>
        <li><a href="/login">Login</a></li>
        <li><a href="/register">Register</a></li>
        <li><a href="/how-to-use">How To Use</a></li>
        <li><a href="/location">Location</a></li>
        <li><a href="/contact">Contact</a></li>

    </ul>

</nav>

<!-- COLLECTION -->

<h1 class="collection-title">
    Our Signature Collection
</h1>

<div class="products-container">

{% for product in products %}

<div class="product-card">

<img src="{{ url_for('static',
filename='images/' + product.image) }}"
alt="Product">

<h2>{{ product.name }}</h2>

<p>{{ product.description }}</p>

<h3>₹{{ product.price }}</h3>

<a href="/product/{{ product.id }}"
class="btn">

View Details

</a>

</div>

{% endfor %}

</div>

<script src="{{ url_for('static',
filename='js/script.js') }}"></script>

</body>
</html>
